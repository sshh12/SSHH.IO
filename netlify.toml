[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Link = '''</.well-known/api-catalog>; rel="api-catalog", <https://sshh.io/sitemap.xml>; rel="sitemap", </llms.txt>; rel="llms-txt"'''

# Markdown mirrors: correct media type; noindex keeps the HTML pages canonical
[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/.well-known/api-catalog"
  [headers.values]
    Content-Type = "application/linkset+json"

[[headers]]
  for = "/projects.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/code*"
  to = "/"
  status = 200

[[redirects]]
  from = "/coffee-chat*"
  to = "/"
  status = 200

[[redirects]]
  from = "/contact*"
  to = "https://forms.gle/m7FMe8beVMH5Z33d9"
  status = 200
