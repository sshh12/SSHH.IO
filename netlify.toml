[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Link = '''</.well-known/api-catalog>; rel="api-catalog", <https://sshh.io/sitemap.xml>; rel="sitemap", </llms.txt>; rel="llms-txt"'''

# Markdown mirrors: correct media type; noindex keeps the HTML pages canonical
[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/.well-known/api-catalog"
  [headers.values]
    Content-Type = "application/linkset+json"

[[headers]]
  for = "/projects.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/posts.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# Best-effort rate-limit disclosure (draft-ietf-httpapi-ratelimit-headers) +
# version header for the read API
[[headers]]
  for = "/api/*"
  [headers.values]
    RateLimit-Policy = '"cdn";q=1000;w=60'
    RateLimit = '"cdn";r=1000;t=60'
    API-Version = "1"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/openapi.json"
  [headers.values]
    RateLimit-Policy = '"cdn";q=1000;w=60'
    API-Version = "1"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/code*"
  to = "/"
  status = 200

[[redirects]]
  from = "/coffee-chat*"
  to = "/"
  status = 200

# Versioned API aliases (canonical paths documented in /openapi.json)
[[redirects]]
  from = "/api/v1/projects.json"
  to = "/projects.json"
  status = 200

[[redirects]]
  from = "/api/v1/posts.json"
  to = "/posts.json"
  status = 200
